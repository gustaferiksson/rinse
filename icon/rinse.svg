      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a4f8a" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="92" y="92" width="840" height="840" rx="196" ry="196"/>
    </clipPath>
    <clipPath id="dropClip">
      <path id="drop" d="M512 192 C 598 306 740 446 740 592 A 228 228 0 0 1 284 592 C 284 446 426 306 512 192 Z"/>
