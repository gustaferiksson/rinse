  <ellipse cx="640" cy="560" rx="22" ry="34" fill="#ffffff" opacity="0.85" transform="rotate(-20 640 560)" filter="url(#blur6)"/>

  <rect x="92" y="92" width="840" height="840" rx="196" ry="196" fill="url(#sheen)"/>
