  </defs>

  <rect x="92" y="92" width="840" height="840" rx="196" ry="196" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <ellipse cx="532" cy="842" rx="210" ry="36" fill="#0d5b9c" opacity="0.35" filter="url(#blur24)"/>
    <ellipse cx="560" cy="836" rx="120" ry="20" fill="#ffffff" opacity="0.5" filter="url(#blur24)"/>
  </g>

  <path d="M512 192 C 598 306 740 446 740 592 A 228 228 0 0 1 284 592 C 284 446 426 306 512 192 Z" fill="url(#body)"/>

  <g clip-path="url(#dropClip)">
