<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e3f4ff"/>
      <stop offset="0.5" stop-color="#b4e0fb"/>
      <stop offset="1" stop-color="#7cc3f0"/>
    </linearGradient>
    <radialGradient id="body" gradientUnits="userSpaceOnUse" cx="500" cy="580" r="270">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.9" stop-color="#3f9ee0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1a6fb8" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="330" y1="200" x2="700" y2="830">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="caustic" gradientUnits="userSpaceOnUse" cx="560" cy="740" r="170">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
