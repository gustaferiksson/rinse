name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gustaferiksson/macos-release/.github/workflows/release.yml@main
    secrets: inherit
    with:
      # AppUpdater downloads Rinse-<version>.zip, and the shared workflow names the zip after `name`.
      name: Rinse
      app: dist/Rinse.app
      cask: rinse
      runner: macos-26
      signed_by_build: true
      build: |
        sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
        brew install xcodegen librsvg
        CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=82K3YC8HVF \
          MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" ./build.sh
