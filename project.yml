name: Rinse
options:
  bundleIdPrefix: dev.gustaf
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Rinse:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
      # XcodeGen has no `resources` key; the asset catalog must be listed as a source.
      - path: Resources/Assets.xcassets
    dependencies:
      - target: RinseControl
        embed: true
    entitlements:
      path: Resources/Rinse.entitlements
      properties:
        com.apple.security.application-groups:
          - 82K3YC8HVF.dev.gustaf.rinse
    settings:
      base:
        PRODUCT_NAME: Rinse
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.Rinse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Rinse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Rinse"
    scheme:
      testTargets:
        - RinseTests

  RinseControl:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RinseControl
      - path: Shared
    entitlements:
      path: RinseControl/RinseControl.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 82K3YC8HVF.dev.gustaf.rinse
    settings:
      base:
        PRODUCT_NAME: RinseControl
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.Rinse.RinseControl
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    info:
      path: RinseControl/Info.plist
      properties:
        CFBundleDisplayName: Rinse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  RinseTests:
    type: bundle.unit-test
    platform: macOS
    # Not hosted in the app: a running Rinse would rewrite the real clipboard during tests.
    sources:
      - path: Tests
      - path: Sources/Transforms.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.Rinse.Tests
        GENERATE_INFOPLIST_FILE: YES
